name: Build Windows app

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Verify release configuration
        shell: pwsh
        run: |
          $source = Get-Content app.py -Raw
          if ($source -match 'DISCORD_APPLICATION_ID\s*=\s*"SET_DISCORD_APPLICATION_ID"') {
            throw "Set the project Discord Application ID before building a release."
          }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = [regex]::Match($source, 'APP_VERSION\s*=\s*"(\d+\.\d+\.\d+)"')
            if (-not $version.Success -or $env:GITHUB_REF_NAME -ne "v$($version.Groups[1].Value)") {
              throw "Release tag must match APP_VERSION in app.py."
            }
          }
          $version = [regex]::Match($source, 'APP_VERSION\s*=\s*"(\d+\.\d+\.\d+)"')
          if (-not $version.Success) { throw "APP_VERSION is missing or invalid." }
          $metadata = Get-Content version_info.txt -Raw
          foreach ($field in @('FileVersion', 'ProductVersion')) {
            if ($metadata -notmatch "StringStruct\('$field', '$([regex]::Escape($version.Groups[1].Value))'\)") {
              throw "$field in version_info.txt must match APP_VERSION."
            }
          }

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DotaActivity --version-file version_info.txt --icon assets/logo_dota.ico --add-data "assets/logo_dota.png;assets" --collect-all pypresence app.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: DotaActivity-Windows-x64
          path: dist/DotaActivity.exe
          if-no-files-found: error
          retention-days: 30

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows executable
        uses: actions/download-artifact@v4
        with:
          name: DotaActivity-Windows-x64
          path: dist

      - name: Prepare versioned release file
        run: cp dist/DotaActivity.exe "dist/DotaActivity-${GITHUB_REF_NAME}-Windows-x64.exe"

      - name: Publish versioned release
        uses: softprops/action-gh-release@v2
        with:
          name: Dota Activity ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: dist/DotaActivity-${{ github.ref_name }}-Windows-x64.exe
