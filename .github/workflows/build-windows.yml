name: Build Windows app

on:
  pull_request:
    branches: [main]
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller

      - name: Verify release configuration
        shell: pwsh
        run: |
          $source = Get-Content app.py -Raw
          if ($source -match 'DISCORD_APPLICATION_ID\s*=\s*"SET_DISCORD_APPLICATION_ID"') {
            throw "Set the project Discord Application ID before building a release."
          }

      - name: Run tests
        run: python -m unittest discover -s tests

      - name: Build standalone executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name DotaActivity --icon assets/logo_dota.ico --add-data "assets/logo_dota.png;assets" --collect-all pypresence app.py

      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotaActivity-Windows-x64
          path: dist/DotaActivity.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish versioned release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Dota Activity ${{ github.ref_name }}
          generate_release_notes: true
          make_latest: true
          files: dist/DotaActivity.exe
